[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-vat-rates-data"
version = "2026.8.19"
description = "VAT rates for 45 European countries — EU-27 plus Norway, Switzerland, UK, and more. Updated daily. From vatnode.dev — live VIES validation via API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Iurii Rogulia", email = "iurii@rogulia.fi" }]
keywords = ["vat", "eu", "european-union", "tax", "rates", "europe", "vat-rates", "eu-vat", "vat-moss", "digital-services-tax", "billing", "e-commerce", "fintech", "invoice"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://vatnode.dev/vat-rates?ref=rates-pypi"
Repository = "https://github.com/vatnode/eu-vat-rates-data-python"
Changelog = "https://github.com/vatnode/eu-vat-rates-data-python/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/vatnode/eu-vat-rates-data-python/issues"
"Data source" = "https://github.com/vatnode/eu-vat-rates-data"
"npm package" = "https://www.npmjs.com/package/eu-vat-rates-data"
"PHP package" = "https://packagist.org/packages/vatnode/eu-vat-rates-data"
"Go package" = "https://pkg.go.dev/github.com/vatnode/eu-vat-rates-data-go"
"Ruby gem" = "https://rubygems.org/gems/eu_vat_rates_data"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_vat_rates_data"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "LICENSE"]
